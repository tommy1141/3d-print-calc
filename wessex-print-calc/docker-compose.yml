services:
  3d-print-calc:
    image: ${IMAGE_REPO:-yourdockerhubuser/3d-print-calc}:${IMAGE_TAG:-1.0.0}
    container_name: 3d-print-calc
    environment:
      - TZ=Europe/London
    volumes:
      - /docker/3d-print-calc/data:/data
      - purchase-orders:/data/purchase-orders
    ports:
      - 5123:80
    restart: unless-stopped

volumes:
  purchase-orders:
    driver_opts:
      type: cifs
      device: ${NAS_DEVICE}
      o: "username=${NAS_USER},password=${NAS_PASS},vers=2.0,uid=${NAS_UID},gid=${NAS_GID}"
